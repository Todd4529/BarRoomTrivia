<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bar Rooms Trivia</title>
  <script>
    (function() {
      var path = window.location.pathname;
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      // Normalize search params
      var params = new URLSearchParams(search);

      // Map paths to views
      var lowerPath = path.toLowerCase();
      if (lowerPath.includes('tv-auth') || lowerPath.includes('auth')) {
        params.set('view', 'auth');
      } else if (lowerPath.includes('play')) {
        params.set('view', 'player');
      } else if (lowerPath.includes('host')) {
        params.set('view', 'host');
      } else if (lowerPath.includes('tv')) {
        params.set('view', 'tv');
      }

      var queryString = params.toString();
      var basePath = window.location.pathname.toLowerCase().includes('/barroomtrivia') ? '/BarRoomTrivia/' : '/';
      var targetUrl = basePath + (queryString ? ('?' + queryString) : '') + hash;
      window.location.replace(targetUrl);
    })();
  </script>
  <style>
    body {
      background-color: #0f0f14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(0, 229, 255, 0.2);
      border-top-color: #00e5ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Loading Bar Rooms Trivia...</h2>
  <p style="color: #94a3b8;">Connecting to game session...</p>
</body>
</html>
