<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bar Rooms Trivia - TV Pairing</title>
  <script>
    (function() {
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      var params = new URLSearchParams(search);
      params.set('view', 'auth');
      var basePath = window.location.pathname.toLowerCase().includes('/barroomtrivia') ? '/BarRoomTrivia/' : '/';
      var targetUrl = basePath + '?' + params.toString() + hash;
      window.location.replace(targetUrl);
    })();
  </script>
  <style>
    body {
      background-color: #0f0f14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(0, 229, 255, 0.2);
      border-top-color: #00e5ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Connecting Host to TV...</h2>
  <p style="color: #94a3b8;">Opening TV authorization screen...</p>
</body>
</html>
