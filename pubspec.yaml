name: bar_rooms_trivia
description: "A real-time cross-platform bar trivia game monorepo built with Flutter and Supabase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  go_router: ^14.2.0
  qr_flutter: ^4.1.0
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.1
  http: ^1.2.1
  shared_preferences: ^2.2.0
  uni_links: ^0.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
    - assets/icon/app_icon.png
