<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bar Rooms Trivia - Host Controls</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://barroomstrivia.com/">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <script>
    (function() {
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      var params = new URLSearchParams(search);
      params.set('view', 'host');
      var basePath = window.location.pathname.toLowerCase().includes('/barroomtrivia') ? '/BarRoomTrivia/' : '/';
      var targetUrl = basePath + '?' + params.toString() + hash;
      window.location.replace(targetUrl);
    })();
  </script>
</head>
<body style="background:#0f0f14;color:#fff;font-family:sans-serif;text-align:center;padding-top:20vh;">
  <h2>Loading Host Controls...</h2>
</body>
</html>
